services:
  postgres:
    image: postgres:16
    container_name: postgres_netspider
    restart: unless-stopped
    environment:
      POSTGRES_DB: netspider
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres16_data:
